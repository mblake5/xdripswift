name: 4. Build xDrip4iOS
run-name: Build xDrip4iOS (${{ github.ref_name }})
on:
  workflow_dispatch:

jobs:
  build:
    name: Build Unsigned Installer
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - name: Select Xcode version
        run: "sudo xcode-select --switch /Applications/Xcode_15.4.app/Contents/Developer"
      
      - name: Checkout Repo Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Force Clean CocoaPods Dependencies
        run: |
          pod repo update
          pod install

      - name: Compile Unsigned Xcode Archive
        run: |
          xcodebuild archive \
            -workspace xDrip4iOS.xcworkspace \
            -scheme xDrip4iOS \
            -configuration Release \
            -archivePath build/xDrip4iOS.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: Structure Binary Bundle into IPA Package
        run: |
          mkdir -p build/Payload
          cp -r build/xDrip4iOS.xcarchive/Products/Applications/xDrip4iOS.app build/Payload/
          cd build
          zip -r xDrip4iOS-Unsigned.ipa Payload

      - name: Upload Raw IPA file to Windows PC
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xDrip4iOS-Sideload-Artifact
          path: build/xDrip4iOS-Unsigned.ipa
