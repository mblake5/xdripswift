name: 4. Build xDrip4iOS
run-name: Build xDrip4iOS (${{ github.ref_name }})
on:
  workflow_dispatch:

jobs:
  build:
    name: Build Raw Installer
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - name: Select Xcode version
        run: "sudo xcode-select --switch /Applications/Xcode_15.4.app/Contents/Developer"
      
      - name: Checkout Repo for building
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Patch Fastlane Match to not print tables
      - name: Patch Match Tables
        run: find /usr/local/lib/ruby/gems -name table_printer.rb | xargs sed -i "" "/puts(Terminal::Table.new(params))/d" || true
      
      # Install project dependencies
      - name: Install Project Dependencies
        run: bundle install
      
      # Sync the GitHub runner clock
      - name: Sync clock
        run: sudo sntp -sS ://windows.com
      
      # Build Xdrip4iOS local compiler archive
      - name: Fastlane Build & Archive
        run: bundle exec fastlane build_xdrip4ios
        env:
          TEAMID: ${{ secrets.TEAMID }}
          GH_PAT: ${{ secrets.GH_PAT }}
          FASTLANE_KEY_ID: ${{ secrets.FASTLANE_KEY_ID }}
          FASTLANE_ISSUER_ID: ${{ secrets.FASTLANE_ISSUER_ID }}
          FASTLANE_KEY: ${{ secrets.FASTLANE_KEY }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      
      # Extract and Upload Build artifacts
      - name: Upload Raw IPA file to Windows PC
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xDrip4iOS-Sideload-Artifact
          path: |
            **/*.ipa
            ios/packages/*.ipa
            artifacts
            buildlog
